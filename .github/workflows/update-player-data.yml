name: Update Transfermarkt player data

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current dataset
        run: |
          mkdir -p data/transfermarkt
          curl -L --fail --retry 3 -o /tmp/player-scores.zip https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores
          unzip -jo /tmp/player-scores.zip players.csv player_valuations.csv -d data/transfermarkt
      - name: Rebuild game database and auction pool
        run: npm run data:import
      - name: Install and run regression checks
        run: npm ci && npm run check
      - name: Validate generated data
        run: |
          test -s data/transfermarkt/players.sqlite
          test -s data/transfermarkt/data-quality.json
          node -e "const q=require('./data/transfermarkt/data-quality.json'); if(q.sourceRows<10000||q.playableProfiles<1000) process.exit(1)"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/transfermarkt-weekly
          delete-branch: true
          commit-message: "data: weekly Transfermarkt refresh"
          title: "data: weekly Transfermarkt refresh"
          body: "Automated dataset refresh. Includes schema, integrity, unit, lint and build checks."
          add-paths: |
            data/transfermarkt/data-quality.json
            app/data/auction-pool.generated.json
